name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-build

      - name: Pack Core Library
        run: dotnet pack src/ConcurrentJobEngine.Core/ConcurrentJobEngine.Core.csproj -c Release -o nupkgs

      - name: Pack Engine Library
        run: dotnet pack src/ConcurrentJobEngine/ConcurrentJobEngine.csproj -c Release -o nupkgs

      - name: Push to NuGet
        run: dotnet nuget push "nupkgs/*.nupkg" -s https://api.nuget.org/v3/index.json --skip-duplicate
