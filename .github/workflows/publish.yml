name: Publish to NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-build

      - name: Pack ConcurrentJobEngine.Core
        run: dotnet pack src/ConcurrentJobEngine.Core/ConcurrentJobEngine.Core.csproj -c Release --no-build -o nupkgs

      - name: Pack ConcurrentJobEngine
        run: dotnet pack src/ConcurrentJobEngine/ConcurrentJobEngine.csproj -c Release --no-build -o nupkgs

      - name: Show packages
        run: ls -la nupkgs

      - name: Publish packages to NuGet
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
